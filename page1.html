<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .content {
            font-size: 1.2em;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        .dots-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            margin-top: auto;
        }
        
        .dot {
            width: 15px;
            height: 15px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: block;
        }
        
        .dot:hover {
            transform: scale(1.3);
            background-color: #cccccc;
        }
        
        .dot.active {
            background-color: #4da6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- INSERT YOUR POETRY OR CONTENT HERE -->
            Your poetry or content goes here.
            
            You can add multiple lines,
            format it however you like,
            and it will display beautifully.
            
            <!-- OR embed a website using an iframe: -->
            <!-- <iframe src="https://example.com" width="100%" height="600px" style="border:none;"></iframe> -->
        </div>
    </div>
    
    <div class="dots-container">
        <a href="index.html" class="dot"></a>
        <a href="page1.html" class="dot active"></a>
        <a href="page2.html" class="dot"></a>
        <a href="page3.html" class="dot"></a>
        <a href="page4.html" class="dot"></a>
        <a href="page5.html" class="dot"></a>
        <a href="page6.html" class="dot"></a>
        <a href="page7.html" class="dot"></a>
        <a href="page8.html" class="dot"></a>
        <a href="page9.html" class="dot"></a>
        <a href="page10.html" class="dot"></a>
    </div>
</body>
</html>
