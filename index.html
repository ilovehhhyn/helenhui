<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        
        .dots-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            margin-top: auto;
        }
        
        .dot {
            width: 15px;
            height: 15px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: block;
        }
        
        .dot:hover {
            transform: scale(1.3);
            background-color: #cccccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Website</h1>
        <p>Click the dots below to explore</p>
    </div>
    
    <div class="dots-container">
        <a href="page1.html" class="dot"></a>
        <a href="page2.html" class="dot"></a>
        <a href="page3.html" class="dot"></a>
        <a href="page4.html" class="dot"></a>
        <a href="page5.html" class="dot"></a>
        <a href="page6.html" class="dot"></a>
        <a href="page7.html" class="dot"></a>
        <a href="page8.html" class="dot"></a>
        <a href="page9.html" class="dot"></a>
        <a href="page10.html" class="dot"></a>
    </div>
</body>
</html>
