    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .github-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85em;
            letter-spacing: 0.05em;
            border: 1px solid #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background-color 0.2s, color 0.2s;
        }

        .github-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
        
        .container {
            max-width: 800px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        
        .dots-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            margin-top: auto;
        }
        
        .dot {
            width: 15px;
            height: 15px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: block;
        }
        
        .dot:hover {
            transform: scale(1.3);
            background-color: #cccccc;
        }
    </style>
</head>
