<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>helen draws</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'IM Fell English', serif;
            min-height: 100vh;
            padding: 60px 40px 40px;
        }

        /* ── header ── */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 2.2em;
            font-weight: 400;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1em;
            font-style: italic;
            opacity: 0.5;
        }

        /* ── back link ── */
        .back-btn {
            position: fixed;
            top: 24px;
            left: 28px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.82em;
            letter-spacing: 0.08em;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 7px 16px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        .back-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* ── masonry grid ── */
        .gallery {
            columns: 3 280px;
            column-gap: 16px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            filter: grayscale(20%);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .gallery-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.02);
        }

        .gallery-item .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: #ffffff;
            padding: 24px 14px 10px;
            font-style: italic;
            font-size: 0.85em;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }

        /* ── lightbox ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 88vh;
            object-fit: contain;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .lightbox-close {
            position: fixed;
            top: 24px;
            right: 28px;
            color: #fff;
            font-size: 1.6em;
            cursor: pointer;
            line-height: 1;
            background: none;
            border: none;
            font-family: Arial, sans-serif;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .lightbox-close:hover { opacity: 1; }

        /* ── dots navigation ── */
        .dots-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 50px 0 20px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: block;
        }

        .dot:hover {
            transform: scale(1.3);
            background-color: #cccccc;
        }

        .dot.active {
            background-color: #4da6ff;
        }

        /* ── empty state ── */
        .empty {
            text-align: center;
            opacity: 0.35;
            font-style: italic;
            font-size: 1.1em;
            padding: 80px 0;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← home</a>

    <div class="header">
        <h1>helen draws</h1>
        <p>a collection of things made by hand</p>
    </div>

    <!-- =============================================
         ADD YOUR IMAGES HERE.
         Replace the src="..." with your actual image
         paths or URLs. Add or remove .gallery-item
         blocks as needed. Caption is optional.
    ============================================= -->
    <div class="gallery">

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/drawing1.jpg" alt="drawing 1" loading="lazy">
            <div class="caption">caption if you want one</div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/drawing2.jpg" alt="drawing 2" loading="lazy">
            <div class="caption"></div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/drawing3.jpg" alt="drawing 3" loading="lazy">
            <div class="caption"></div>
        </div>

        <!-- add more items here -->

    </div>

    <!-- lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <div class="dots-container">
        <a href="index.html" class="dot"></a>
        <a href="page1.html" class="dot"></a>
        <a href="page2.html" class="dot"></a>
        <a href="page3.html" class="dot"></a>
        <a href="page4.html" class="dot"></a>
        <a href="page5.html" class="dot"></a>
        <a href="page6.html" class="dot"></a>
        <a href="page7.html" class="dot"></a>
        <a href="page8.html" class="dot"></a>
        <a href="page9.html" class="dot"></a>
        <a href="page10.html" class="dot"></a>
    </div>

    <script>
        function openLightbox(item) {
            const img = item.querySelector('img');
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox').classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

</body>
</html>
