<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>helen draws</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 60px 40px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 2.2em;
            font-weight: normal;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1em;
            opacity: 0.5;
        }

        .back-btn {
            position: fixed;
            top: 24px;
            left: 28px;
            color: #000000;
            text-decoration: none;
            font-size: 0.85em;
            letter-spacing: 0.05em;
            border: 1px solid #000000;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background-color 0.2s, color 0.2s;
        }

        .back-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .gallery {
            columns: 3 260px;
            column-gap: 14px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        .gallery-item .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, #ffffff);
            color: #000000;
            padding: 24px 14px 10px;
            font-size: 0.82em;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 88vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 24px;
            color: #000000;
            font-size: 1.8em;
            cursor: pointer;
            background: none;
            border: none;
            font-family: Arial, sans-serif;
            opacity: 0.7;
            transition: opacity 0.2s;
            line-height: 1;
        }

        .lightbox-close:hover { opacity: 1; }

        .dots-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 50px 0 20px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background-color: #000000;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: block;
        }

        .dot:hover {
            transform: scale(1.3);
            background-color: #000000;
        }

        .dot.active {
            background-color: #000000;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← home</a>

    <div class="header">
        <h1>helen draws</h1>
        <p>a collection of things made by hand</p>
    </div>

    <div class="gallery">

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/9A22E8E1-F09D-4DEC-A9D1-AFF5B157DE6E_1_105_c.jpeg" alt="drawing" loading="lazy">
            <div class="caption"></div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/A153C337-A384-4273-8995-47A3AE5AE8CC_1_105_c.jpeg" alt="drawing" loading="lazy">
            <div class="caption"></div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/C4A4C82F-6EB5-4D6A-907D-90F1C46BBF01_4_5005_c.jpeg" alt="drawing" loading="lazy">
            <div class="caption"></div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/C4E77C6D-5B55-4124-97C5-A6D0CD8ED908_1_105_c.jpeg" alt="drawing" loading="lazy">
            <div class="caption"></div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/DA6397DA-5A36-4CBE-8D81-F5CB3CC7D515_1_105_c.jpeg" alt="drawing" loading="lazy">
            <div class="caption"></div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/DC606E66-C151-43C8-8662-AB42F4A51BA0.png" alt="drawing" loading="lazy">
            <div class="caption"></div>
        </div>

        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images/FE35CE9F-40D0-4D41-A4AE-0809D51F3963_1_105_c.jpeg" alt="drawing" loading="lazy">
            <div class="caption"></div>
        </div>

    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <div class="dots-container">
        <a href="page1.html" class="dot"></a>
        <a href="page2.html" class="dot"></a>
        <a href="page3.html" class="dot"></a>
        <a href="page4.html" class="dot"></a>
        <a href="page5.html" class="dot"></a>
        <a href="page6.html" class="dot"></a>
    </div>

    <script>
        function openLightbox(item) {
            const img = item.querySelector('img');
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox').classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

    <script src="writings.js"></script>
</body>
</html>
